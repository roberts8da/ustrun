name: JustRunMy 自动续期

# 触发条件
on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发 (每天凌晨1点)
  schedule:
    - cron: '5 3 */1 * *'

# 权限配置
permissions:
  contents: write
  actions: write

# 工作流任务
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ========== Secrets 配置 ==========
      JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
      JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      
      NODE_LINK: ${{ secrets.NODE_LINK_JUSTRUNMY }}
      
      # ========== 项目配置 ==========
      SCREENSHOT_DIR: screenshots
    
    steps:
      # 步骤 1: 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: 设置 Python 环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # 步骤 3: 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot fonts-noto-cjk

      # 步骤 4: 安装 Python 依赖
      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install seleniumbase aiohttp requests

      # 步骤 5: 设置自定义代理
      - name: 🌐 设置自定义代理
        env:
          NODE_LINK: ${{ env.NODE_LINK_JUSTRUNMY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x scripts/setup_proxy.sh
          if ! bash scripts/setup_proxy.sh; then
            echo "❌ 代理设置失败，发送通知..."
            curl -s -X POST "https://telegram.org{TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>JustRunMy 续期失败</b>%0A%0A原因: 代理不可用%0A仓库: ${{ github.repository }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --max-time 10 || true
            exit 1
          fi

      # 步骤 6: 执行脚本
      - name: 🚀 运行续期脚本
        env:
          JUSTRUNMY_EMAIL: ${{ env.JUSTRUNMY_EMAIL }}
          JUSTRUNMY_PASSWORD: ${{ env.JUSTRUNMY_PASSWORD }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }} #
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python justrunmy_renew.py

      # 步骤 7: 上传截图
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: "*.png"
          retention-days: 7

      # 步骤 8: 清理本地截图
      - name: 🧹 清理本地截图
        if: always()
        run: |
          rm -f *.png
          echo "✅ 本地截图已清理"

      # 步骤 9: 提交执行时间到公开库
      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p justrunmy && echo "$(date +'%Y-%m-%d %H:%M:%S')" > justrunmy/time.txt
          git add justrunmy/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新执行时间: $TIMESTAMP"
            git fetch origin main
            git push -f origin HEAD:main
            echo "✅ 更改已推送"
          fi

      # 步骤 10: 始终只保留最近 2 条记录
      - name: 🧹 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
