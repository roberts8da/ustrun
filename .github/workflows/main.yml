name: JustRunMy 自动续期

# 触发条件
on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发 (北京时间每天下午 18:00 一次)
  # 北京时间 18:00 = UTC 时间 10:00
  schedule:
    - cron: '0 10 * * *'

# 权限配置
permissions:
  contents: write
  actions: write

# 工作流任务
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ========== Secrets 配置 ==========
      JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
      JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      
      # 自定义节点代理配置 (对应 GitHub Secrets 中的订阅/节点链接)
      NODE_LINK: ${{ secrets.NODE_LINK_LUNES }}
      
      # ========== 项目配置 ==========
      SCREENSHOT_DIR: screenshots
    
    steps:
      # 步骤 1: 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: 设置 Python 环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # 步骤 3: 安装系统依赖
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot fonts-noto-cjk

      # 步骤 4: 安装 Python 依赖
      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0 aiohttp

      # 步骤 5: 设置自定义代理 (终极强行捕获版：防止脚本内 exit 阻断)
      - name: 🌐 设置自定义代理
        env:
          NODE_LINK: ${{ env.NODE_LINK }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
        run: |
          if [ -f "scripts/setup_proxy.sh" ]; then
            chmod +x scripts/setup_proxy.sh
            
            # 1. 在子 Shell 中执行脚本，并将其执行后产生的全局环境变量保存到临时文件中
            # 这样即使脚本内部有 exit 或者是私有 export，也能完美绕过阻断
            bash -c "source scripts/setup_proxy.sh && env" > all_env.txt
            
            # 2. 从临时文件中精准提取 PROXY_SERVER 的值
            EXTRACTED_PROXY=$(grep "^PROXY_SERVER=" all_env.txt | cut -d'=' -f2-)
            
            # 3. 兼容性检查：如果没找到 PROXY_SERVER，尝试寻找常用的其他代理变量名
            if [ -z "$EXTRACTED_PROXY" ]; then
              EXTRACTED_PROXY=$(grep -E "^(socks5_proxy|http_proxy|HTTPS_PROXY|ALL_PROXY)=" all_env.txt | head -n1 | cut -d'=' -f2-)
            fi
            
            # 4. 强制写入 GitHub 全局环境变数
            if [ -n "$EXTRACTED_PROXY" ]; then
              echo "PROXY_SERVER=$EXTRACTED_PROXY" >> $GITHUB_ENV
              echo "✅ 成功强行捕获并写入代理服务器: $EXTRACTED_PROXY"
              rm -f all_env.txt
            else
              echo "❌ 提取失败！all_env.txt 内容如下，请检查脚本输出的变量名："
              cat all_env.txt | grep -E "proxy|PROXY|SERVER|PORT" || true
              rm -f all_env.txt
              exit 1
            fi
          else
            echo "❌ 未在 scripts 文件夹内找到 setup_proxy.sh 脚本！"
            exit 1
          fi

      # 步骤 6: 执行脚本 (路径已精确对接到 scripts/Justrunmy/ 目录，注意大写 J)
      - name: 🚀 运行续期脚本
        env:
          JUSTRUNMY_EMAIL: ${{ env.JUSTRUNMY_EMAIL }}
          JUSTRUNMY_PASSWORD: ${{ env.JUSTRUNMY_PASSWORD }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python scripts/Justrunmy/justrunmy_renew.py

      # 步骤 7: 上传截图 (支持多层级目录下的所有 .png 截图捕获)
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: "**/*.png"
          retention-days: 7

      # 步骤 8: 清理本地截图 (覆盖所有可能产生截图的子目录)
      - name: 🧹 清理本地截图
        if: always()
        run: |
          rm -f *.png scripts/*.png scripts/Justrunmy/*.png 2>/dev/null || true
          echo "✅ 本地截图已清理"

      # 步骤 9: 提交执行时间到公开库
      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          mkdir -p justrunmy && echo "$(date +'%Y-%m-%d %H:%M:%S')" > justrunmy/time.txt
          git add justrunmy/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新执行时间: $TIMESTAMP"
            git fetch origin main
            git push -f origin HEAD:main
            echo "✅ 更改已推送"
          fi

      # 步骤 10: 始终只保留最近 2 条记录
      - name: 🧹 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
