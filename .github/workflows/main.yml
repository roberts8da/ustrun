name: JustRunMy 自动续期

# 触发条件
on:
  # 手动触发
  workflow_dispatch:
  
  # 定时触发 (北京时间每天下午 18:00 一次)
  # 北京时间 18:00 = UTC 时间 10:00
  schedule:
    - cron: '0 10 * * *'

# 权限配置
permissions:
  contents: write
  actions: write

# 工作流任务
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ========== Secrets 配置 ==========
      JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
      JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      
      # 自定义节点代理配置 (对应 GitHub Secrets 中的订阅/节点链接)
      NODE_LINK: ${{ secrets.NODE_LINK_LUNES }}
      
      # ========== 项目配置 ==========
      SCREENSHOT_DIR: screenshots
    
    steps:
      # 步骤 1: 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 步骤 2: 设置 Python 环境
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # 步骤 3: 安装系统依赖 (增加安装 lunes 所需的系统库)
      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot fonts-noto-cjk

      # 步骤 4: 安装 Python 依赖
      - name: 📚 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0 aiohttp

      # 步骤 5: 设置自定义代理 (用 source 執行，並由 YAML 強行寫入全局環境)
      - name: 🌐 设置自定义代理
        env:
          NODE_LINK: ${{ env.NODE_LINK }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
        run: |
          if [ -f "scripts/setup_proxy.sh" ]; then
            chmod +x scripts/setup_proxy.sh
            
            # 【核心修正】不使用 bash，改用 source 執行，這樣變數才會留在當前進程！
            source scripts/setup_proxy.sh
            
            # 如果執行後當前 Shell 裡有 PROXY_SERVER 或者是 PROXY，立刻強行寫入 GitHub 全局環境
            # 優先讀取 PROXY_SERVER，如果沒有就讀取 PROXY 變數
            FINAL_PROXY="${PROXY_SERVER:-$PROXY}"
            
            if [ -n "$FINAL_PROXY" ]; then
              echo "PROXY_SERVER=$FINAL_PROXY" >> $GITHUB_ENV
              echo "✅ 成功捕獲並寫入代理伺服器: $FINAL_PROXY"
            else
              echo "❌ 代理設定失敗，source 執行後未在當前環境發現 PROXY_SERVER 或 PROXY 變數"
              exit 1
            fi
          else
            echo "❌ 未在 scripts 資料夾內找到 setup_proxy.sh 腳本！"
            exit 1
          fi

      # 步骤 6: 执行脚本
      - name: 🚀 运行续期脚本
        env:
          JUSTRUNMY_EMAIL: ${{ env.JUSTRUNMY_EMAIL }}
          JUSTRUNMY_PASSWORD: ${{ env.JUSTRUNMY_PASSWORD }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID }}
          # 這裡會精確拿到上一步用 >> $GITHUB_ENV 寫入的變數
          PROXY_SERVER: ${{ env.PROXY_SERVER }} 
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python scripts/Justrunmy/justrunmy_renew.py

      # 步骤 7: 上传截图 (支持多层级目录下的所有 .png 截图捕获)
      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: "**/*.png"
          retention-days: 7

      # 步骤 8: 清理本地截图 (覆盖所有可能产生截图的子目录)
      - name: 🧹 清理本地截图
        if: always()
        run: |
          rm -f *.png scripts/*.png scripts/Justrunmy/*.png 2>/dev/null || true
          echo "✅ 本地截图已清理"

      # 步骤 9: 提交执行时间到公开库
      - name: ⏱️ 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p justrunmy && echo "$(date +'%Y-%m-%d %H:%M:%S')" > justrunmy/time.txt
          git add justrunmy/time.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
            git commit -m "⏱️ 更新执行时间: $TIMESTAMP"
            git fetch origin main
            git push -f origin HEAD:main
            echo "✅ 更改已推送"
          fi

      # 步骤 10: 始终只保留最近 2 条记录
      - name: 🧹 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
